<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заявки жителей — Акимат г. Атырау</title>
    <link rel="stylesheet" href="css/style.css?v=10" />
    <link rel="manifest" href="manifest.json" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #0f1624;
            color: #e0e6f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        .akimat-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }
        .akimat-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .akimat-page-header h1 {
            margin: 0;
            font-size: clamp(15px, 2.4vw, 20px);
            color: #f39c12;
            flex: 1 1 200px;
            min-width: 0;
            word-wrap: break-word;
        }
        .akimat-page-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .akimat-page-controls a {
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            color: #e0e6f0;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .akimat-page-controls a:hover { background: rgba(255,255,255,0.1); }
        .akimat-page-controls button {
            padding: 8px 14px;
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .akimat-lang { display: flex; gap: 4px; }
        .akimat-lang button {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            color: #8892b0;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .akimat-lang button.active {
            background: #3498db;
            color: #fff;
            border-color: #3498db;
        }
        .akimat-page .akimat-tabs {
            padding: 0;
            margin-bottom: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .akimat-page .akimat-tabs::-webkit-scrollbar { display: none; }
        .akimat-page .akimat-tab { white-space: nowrap; flex-shrink: 0; }
        /* Страница прокручивается естественно через body, чтобы список
           не ограничивался высотой контейнера и скроллился на планшетах. */
        .akimat-page .akimat-panel-body {
            padding: 0;
            overflow: visible;
            flex: 0 1 auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Адаптив для страницы акимата */
        @media (max-width: 768px) {
            .akimat-page { padding: 0 16px 32px; }
            .akimat-page-header { padding: 14px 0; margin-bottom: 16px; gap: 10px; }
            .akimat-page-controls { gap: 6px; }
            .akimat-page-controls a,
            .akimat-page-controls button { padding: 7px 12px; font-size: 12.5px; }
        }
        @media (max-width: 560px) {
            .akimat-page { padding: 0 12px 24px; }
            .akimat-page-header { flex-direction: column; align-items: stretch; padding: 12px 0; }
            .akimat-page-header h1 { font-size: 16px; text-align: center; }
            .akimat-page-controls {
                width: 100%;
                justify-content: space-between;
                gap: 6px;
            }
            .akimat-page-controls a,
            .akimat-page-controls button {
                flex: 1;
                text-align: center;
                padding: 8px 6px;
                font-size: 12px;
            }
            .akimat-lang { order: -1; justify-content: center; width: 100%; }
            .akimat-lang button { padding: 5px 14px; flex: 1; max-width: 100px; }
        }
        @media (max-width: 380px) {
            .akimat-page-header h1 { font-size: 14.5px; }
            .akimat-page-controls a,
            .akimat-page-controls button { font-size: 11.5px; padding: 7px 4px; }
        }
    </style>
</head>
<body>
    <div class="akimat-page">
        <div class="akimat-page-header">
            <h1 data-i18n="akimat_page_title">Заявки жителей — Акимат г. Атырау</h1>
            <div class="akimat-page-controls">
                <div class="akimat-lang">
                    <button class="lang-btn" data-lang="ru">RU</button>
                    <button class="lang-btn" data-lang="kz">KZ</button>
                </div>
                <a href="/" data-i18n="akimat_back_to_map">← На карту</a>
                <button id="akimat-logout" data-i18n="akimat_logout_btn">Выйти</button>
            </div>
        </div>

        <div class="akimat-tabs">
            <button class="akimat-tab active" data-tab="new" data-i18n="akimat_tab_new">Новые</button>
            <button class="akimat-tab" data-tab="inprogress" data-i18n="akimat_tab_inprogress">В работе</button>
            <button class="akimat-tab" data-tab="archive" data-i18n="akimat_tab_archive">Архив</button>
        </div>

        <div id="akimat-panel-body" class="akimat-panel-body"></div>
    </div>

    <!-- Accept dialog -->
    <div id="akimat-accept-overlay" class="hidden">
        <div id="akimat-accept-modal">
            <button id="akimat-accept-close" aria-label="Закрыть">&times;</button>
            <h2 data-i18n="akimat_accept_title">Принять заявку в работу</h2>
            <div class="login-form">
                <label data-i18n="akimat_accept_days_label">За сколько дней устраните проблему?</label>
                <input type="number" id="akimat-accept-days" min="1" max="365" value="30" />
                <div class="akimat-modal-actions">
                    <button id="akimat-accept-cancel" class="btn-secondary" data-i18n="akimat_cancel">Отмена</button>
                    <button id="akimat-accept-submit" class="btn-primary" data-i18n="akimat_accept_confirm">Подтвердить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Resolve dialog (фото устранения) -->
    <div id="akimat-resolve-overlay" class="hidden">
        <div id="akimat-resolve-modal">
            <button id="akimat-resolve-close" aria-label="Закрыть">&times;</button>
            <h2 data-i18n="akimat_resolve_title">Устранение проблемы</h2>
            <div class="login-form">
                <label data-i18n="akimat_resolve_photo_label">Фото устранения:</label>
                <p class="akimat-resolve-hint" data-i18n="akimat_resolve_photo_hint">Приложите фото, подтверждающее устранение</p>
                <input type="file" id="akimat-resolve-photo-input" accept="image/*" capture="environment" hidden />
                <button type="button" id="akimat-resolve-photo-pick" class="btn-secondary" data-i18n="akimat_resolve_photo_pick">Выбрать фото</button>
                <div id="akimat-resolve-photo-preview" class="akimat-resolve-preview hidden"></div>
                <div id="akimat-resolve-err" class="akimat-resolve-err"></div>
                <div class="akimat-modal-actions">
                    <button id="akimat-resolve-cancel" class="btn-secondary" data-i18n="akimat_cancel">Отмена</button>
                    <button id="akimat-resolve-submit" class="btn-success" data-i18n="akimat_resolve">Отметить как устранено</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reject dialog -->
    <div id="akimat-reject-overlay" class="hidden">
        <div id="akimat-reject-modal">
            <button id="akimat-reject-close" aria-label="Закрыть">&times;</button>
            <h2 data-i18n="akimat_reject_title">Отклонить заявку</h2>
            <div class="login-form">
                <label data-i18n="akimat_reject_reason_label">Причина отклонения:</label>
                <textarea id="akimat-reject-reason" rows="4" placeholder="..."></textarea>
                <div class="akimat-modal-actions">
                    <button id="akimat-reject-cancel" class="btn-secondary" data-i18n="akimat_cancel">Отмена</button>
                    <button id="akimat-reject-submit" class="btn-danger" data-i18n="akimat_reject_confirm">Отклонить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js?v=1"></script>
    <script src="js/i18n.js?v=4"></script>
    <script src="js/data.js?v=1"></script>
    <script src="js/akimat-page.js?v=2"></script>
</body>
</html>
